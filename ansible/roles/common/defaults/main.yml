---
# Basispakete, die auf jeder Maschine vorhanden sein sollen.
common_packages:
  - acl
  - ca-certificates
  - curl
  - git
  - gnupg
  - htop
  - jq
  - less
  - python3
  - python3-apt
  - rsync
  - sudo
  - tmux
  - tree
  - tzdata
  - unzip
  - vim
  - wget

# Optional alle vorhandenen Pakete aktualisieren (kann lange dauern).
common_upgrade_packages: false
