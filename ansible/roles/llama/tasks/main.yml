---
- name: Unterstuetzte Distribution pruefen
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    fail_msg: >-
      Die Llama-Rolle unterstuetzt nur Debian und Ubuntu.
      Gefunden: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
    quiet: true

- name: Voraussetzungen fuer das Docker-Repository installieren
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install linux-headers package
  ansible.builtin.apt:
    pkg: linux-headers-{{ ansible_facts['kernel'] }}
    state: present

- name: non-free apt-Repository einrichten
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie non-free-firmware contrib
      deb-src [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie non-free-firmware contrib
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie-security non-free-firmware contrib
      deb-src [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie-security non-free-firmware contrib
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie-updates non-free-firmware contrib
      deb-src [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie-updates non-free-firmware contrib
    filename: non-free
    state: present
    update_cache: true

# Download and install a .deb from a URL
- name: Download application package
  ansible.builtin.get_url:
    url: https://developer.download.nvidia.com/compute/cuda/13.4.3/local_installers/cuda-repo-debian13-13-4-local_13.4.3-1_amd64.deb
    dest: /tmp/cuda-repo-debian13-13-4-local_13.4.3-1_amd64.deb
    #checksum: sha256:e7f219eab6fe4819cdb5c15b98233dc3420302d9c00883219cd3d896857cf48d
    mode: '0644'

- name: Install downloaded .deb
  ansible.builtin.apt:
    deb: /tmp/cuda-repo-debian13-13-4-local_13.4.3-1_amd64.deb

- name: install key for apt repo
  ansible.builtin.command:
    cmd: cp /var/cuda-repo-debian13-13-4-local/cuda-*-keyring.gpg /usr/share/keyrings/

- name: update apt repositories
  ansible.builtin.command:
    cmd: apt-get update
- name: Voraussetzungen fuer das Docker-Repository installieren
  ansible.builtin.apt:
    name:
      - cuda-toolkit-13-4
    state: present
    update_cache: true
    cache_valid_time: 3600


