---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_service_name: docker
docker_service_state: started
docker_service_enabled: true

# Benutzer, die Docker ohne sudo verwenden duerfen.
# Achtung: Mitgliedschaft in der Gruppe "docker" entspricht faktisch root-Rechten.
docker_users: []

# Inhalt von /etc/docker/daemon.json
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
  live-restore: true

docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
docker_apt_repository: >-
  deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring }}]
  https://download.docker.com/linux/{{ ansible_distribution | lower }}
  {{ ansible_distribution_release }} stable
