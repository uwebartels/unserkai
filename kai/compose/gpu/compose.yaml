# Kai GPU-Stack (kai-gpu): llama-swap mit llama.cpp.
# Ohne GPU (Test-VM) kommt zusaetzlich compose.cpu.yaml dazu, das die Reservierung entfernt;
# Image wird mit kai/bin/kai-pin-images auf Tag + Digest gepinnt.
name: kai-gpu

services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda@sha256:77d3353a244f970e7e7b1171c170f04a0e53fc509c0c100724c61c93fa45c989
    restart: unless-stopped
    # .env traegt LLAMA_SWAP_KEY (ein Mensch legt sie an, 0600); llama-swap liest ihn als ${env.LLAMA_SWAP_KEY}.
    env_file:
      - .env
      - path: ./proxy.env
        required: false
    ports:
      - "${KAI_GPU_BIND:-127.0.0.1}:${KAI_GPU_PORT:-8080}:8080"
    volumes:
      - ./llama-swap.yaml:/etc/llama-swap/config/config.yaml:ro
      - ${KAI_MODELS_DIR:-/opt/kai/models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Das Image hat weder wget noch curl; bash spricht HTTP ueber /dev/tcp. Mit apiKeys verlangt auch /health den Key.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\nAuthorization: Bearer %s\r\n\r\n' "$$LLAMA_SWAP_KEY" >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
